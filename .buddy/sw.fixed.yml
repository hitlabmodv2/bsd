- pipeline: sw
  refs:
  - :default
  events:
  - type: PUSH
  fail_on_prepare_env_warning: true
  actions:
  - action: npm start
    type: BUILD
    docker_image_name: library/node
    docker_image_tag: 22
    execute_commands:
    - "# yarn install"
    - npm install
    - npm start
    shell: BASH
