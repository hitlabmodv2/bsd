- pipeline: sw
  refs:
  - :default
  events:
  - type: PUSH
  no_skip_to_most_recent: true
  cache_scope: WORKSPACE
  fail_on_prepare_env_warning: true
  concurrent_pipeline_runs: true
  resources: X2LARGE
  arch: ARM64
  actions:
  - action: npm start
    type: BUILD
    docker_image_name: library/node
    docker_image_tag: 22
    execute_commands:
    - "# yarn install"
    - npm install
    - npm start
    shell: BASH
