
version: '3.8'

services:
  whatsapp-bot:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: whatsapp-bot-nodejs21
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      # Persistent data volumes
      - ./sesi:/app/sesi
      - ./DATA:/app/DATA
      - ./database:/app/database
      - ./temp:/app/temp
      - ./attached_assets:/app/attached_assets
    environment:
      - NODE_ENV=production
      - PORT=3000
      - TZ=Asia/Jakarta
      # Add any other environment variables here
    networks:
      - bot-network
    stdin_open: true
    tty: true
    # Memory and CPU limits
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'

networks:
  bot-network:
    driver: bridge
